name: Deploy Stack (Droplet Build)

on:
  push:
    branches: [main]
    # OPTIMIZACIÓN: El CI/CD solo se dispara si cambias código real.
    # Si modificas documentación, no gastarás minutos.
    paths:
      - 'bp-backend-web/**'
      - 'bp-frontend-web/**'
      - 'bp-ml-microservice/**'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH (Zero-Minute Build)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # El script se ejecuta en tu Droplet. GitHub no cobra por el tiempo
          # que tarda el Droplet en compilar, solo por los segundos que tarda en enviar este comando.
          script: |
            echo "🚀 Iniciando despliegue directo en Droplet..."
            cd /home/deploy/bluephy
            
            echo "1️⃣ Descargando últimos cambios de GitHub..."
            git checkout main
            git pull origin main
            
            echo "2️⃣ Construyendo imágenes (Backend, Frontend, ML)..."
            # Esto usa la caché de Docker del Droplet, haciéndolo muy rápido.
            docker compose build
            
            echo "3️⃣ Levantando servicios..."
            docker compose up -d
            
            echo "4️⃣ Limpieza automática de disco (ROM)..."
            docker image prune -f
            
            echo "✅ ¡Despliegue exitoso!"

