name: Deploy Stack (Droplet Build)

on:
  push:
    branches: [main]
    paths:
      - 'bp-backend-web/**'
      - 'bp-frontend-web/**'
      - 'bp-ml-microservice/**'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Transfer Source Code to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Copia todo el repositorio al Droplet
          source: "."
          target: "/home/deploy/bluephy/src"
          
      - name: Build & Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "🚀 Iniciando despliegue directo en Droplet..."
            cd /home/deploy/bluephy/src
            
            echo "1️⃣ Moviendo archivos .env locales al código fuente..."
            # Tu Droplet tiene el .env principal en /home/deploy/bluephy
            # Lo copiamos al backend:
            cp /home/deploy/bluephy/.env ./bp-backend-web/.env
            
            # El ML microservice necesita su propio .env
            # Lo creamos a partir de tu .env global más lo del ml-service
            cp ./bp-ml-microservice/.env.example ./bp-ml-microservice/.env
            # Extraemos la INTERNAL_KEY del env principal y la inyectamos al de ML
            INTERNAL_KEY=$(grep ML_SERVICE_INTERNAL_KEY /home/deploy/bluephy/.env | cut -d '=' -f2)
            sed -i "s/^INTERNAL_KEY=.*/INTERNAL_KEY=$INTERNAL_KEY/" ./bp-ml-microservice/.env
            
            echo "2️⃣ Construyendo imágenes (Backend, Frontend, ML)..."
            # Compila usando la CPU del Droplet (cero costo de GitHub)
            docker compose build
            
            echo "3️⃣ Levantando servicios..."
            docker compose up -d
            
            echo "4️⃣ Limpieza automática de imágenes viejas..."
            docker image prune -f
            
            echo "✅ ¡Despliegue exitoso!"


